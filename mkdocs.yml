site_name: RADIOBLOCKS VLBI simulations with ehtim
site_description: >-
  User guides for the RADIOBLOCKS VLBI simulation cases: LBA + SKA-Low at 250 MHz, EVN + AVN + SKA-Mid at 5 GHz
  (point source, relativistic jet, hands-on class) and the time-variable jet of an X-ray binary.
# GitHub account that hosts the repository (also in repo_url below); change it if the repository moves.
site_url: https://radioblocks-vlbi.github.io/radioblocks-vlbi-ehtim/
repo_url: https://github.com/radioblocks-vlbi/radioblocks-vlbi-ehtim
repo_name: radioblocks-vlbi-ehtim
copyright: "Copyright &copy; 2026 RADIOBLOCKS · Distributed under the GNU GPL v3.0 · Contact: radioblocks.vlbi@gmail.com"

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Each case folder has its own docs/ and mkdocs.yml; the monorepo plugin merges them into this site.
  - monorepo

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Arrays (always with SKA): concepts/arrays.md
      - Error scenarios A, B, C: concepts/scenarios.md
      - Imaging pipeline and diagnostics: concepts/imaging.md
  - Cases:
      - point-source-lowfreq (LBA + SKA-Low, 250 MHz): '!include ./point-source-lowfreq/mkdocs.yml'
      - point-source-midfreq (EVN + AVN + SKA-Mid, 5 GHz): '!include ./point-source-midfreq/mkdocs.yml'
      - jet-midfreq (EVN + AVN + SKA-Mid, 5 GHz): '!include ./jet-midfreq/mkdocs.yml'
      - jet-midfreq-class (hands-on class): '!include ./jet-midfreq-class/mkdocs.yml'
      - xray-binary-jet-midfreq (X-ray binary, EVN (no SKA) vs. EVN + AVN + SKA-Mid): '!include ./xray-binary-jet-midfreq/mkdocs.yml'
  - References: references.md
